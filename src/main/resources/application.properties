spring.application.name=DEVLOP_ContainerControl_Project
# DataSource settings
spring.datasource.url=jdbc:mysql://localhost:3307/ContainerControl
#spring.datasource.url=jdbc:mysql://mysql:3306/ContainerControl
spring.datasource.username=pedro.monteiro
spring.datasource.password=${db_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#liquibase configurations
spring.liquibase.change-log=classpath:MigrationConfig.xml
spring.liquibase.enabled=true
#retorna mais detalhes nos logs do liquibase
logging.level.liquibase=DEBUG
spring.shutdown.enabled=false

#actuator exposure
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.db.enabled=true
management.health.db.show-details=always





# Hibernate settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Naming strategy to keep camelCase as camelCase in column names
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl

# Server settings
#Ensure the application runs on the same port as specified in Docker Compose
server.port=8080
# Bind to all interfaces to ensure the actuator health check works inside the container
server.address=0.0.0.0


#hikaari settings
spring.datasource.hikari.initialization-fail-timeout=30000
spring.datasource.hikari.connection-timeout=30000

