spring.application.name=DEVLOP_ContainerControl_Project
# DataSource settings

#DOCKER VARIABLES - FOR PRODUCTION IN FINAL VERSION OF DATABASE
#datasource url for docker container
spring.datasource.url=jdbc:mysql://localhost:3307/ContainerControl
#datasource credentials docker container
spring.datasource.username=root
spring.datasource.password=PEDROmonteiro1992
#driver class sql (docker)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


#SPRING H2 VARIABLES - PROOF OF CONCEPT AND DEVELOPMENT
#datasource url for h2 database
#spring.datasource.url=jdbc:h2:file:./testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
#driver class h2
#spring.datasource.driver-class-name=org.h2.Driver
#h2 credentials
#spring.datasource.username=root
#spring.datasource.password=root
#ENABLE H2 CONSOLE
spring.h2.console.enabled=true

#Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

#logger
logging.level.root = info



# Hibernate settings
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false
#docker sql dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

#h2 dialect
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect


# Naming strategy to keep camelCase as camelCase in column names
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl