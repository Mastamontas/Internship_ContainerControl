spring.application.name=DEVLOP_ContainerControl_Project
# DataSource settings
spring.datasource.url=jdbc:mysql://localhost:3307/ContainerControl
#para ligar a container docker
#spring.datasource.url=jdbc:mysql://mysql:3306/ContainerControl
spring.datasource.username=${db_user}
spring.datasource.password=${db_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate settings
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Naming strategy to keep camelCase as camelCase in column names
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl